[package]
name = "maolan-editor"
version = "0.1.2"
edition = "2024"
description = "Simple audio editor for Maolan audio files"
license = "BSD-2-Clause"
readme = "README.md"
publish = true
repository = "https://github.com/maolan/edit"
homepage = "https://maolan.rs"
keywords = ["audio", "edit", "sound"]
categories = ["multimedia::audio"]

[profile.dev]
opt-level = 3
debug = true

[features]
default = ["standalone"]
standalone = [
    "dep:alsa",
    "dep:maolan-engine",
    "maolan-engine?/audio",
    "maolan-engine?/plugins",
    "dep:oxideav-basic",
    "dep:oxideav-core",
    "dep:oxideav-flac",
    "dep:oxideav-mp3",
    "dep:oxideav-ogg",
    "dep:symphonia",
]
embedded = ["dep:maolan-engine", "maolan-engine?/audio"]

[dependencies]
maolan-engine = { version = "0.4.16", optional = true }
oxideav-core = { version = "0.1.42", optional = true }
oxideav-basic = { version = "0.0.11", optional = true }
oxideav-flac = { version = "0.0.12", optional = true }
oxideav-mp3 = { version = "0.1.3", optional = true }
oxideav-ogg = { version = "0.1.9", optional = true }
symphonia = { version = "0.6.1", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"], optional = true }
maolan-widgets = "0.0.44"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
rubato = "5.0.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time"] }
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.12.1", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[package.metadata.deb]
name = "maolan-editor"
maintainer = "Maolan Team <studio@maolan.rs>"
section = "sound"
priority = "optional"
copyright = "2026, Maolan Team <studio@maolan.rs>"
depends = "jackd2 | pipewire-jack, libasound2t64 | libasound2"
assets = [
  ["target/release/maolan-editor", "usr/bin/", "755"],
  ["assets/desktop/maolan-editor-linux.desktop", "usr/share/applications/maolan-editor.desktop", "644"],
  ["assets/images/maolan-editor-icon.svg", "usr/share/icons/hicolor/scalable/apps/maolan-editor-icon.svg", "644"],
  ["README.md", "usr/share/doc/maolan-editor/", "644"],
  ["LICENSE", "usr/share/doc/maolan-editor/", "644"],
]

[package.metadata.generate-rpm.requires]
"(jack-audio-connection-kit or pipewire-jack-audio-connection-kit)" = "*"
"alsa-lib" = "*"

[package.metadata.generate-rpm]
name = "maolan-editor"
summary = "Simple audio editor for Maolan audio files"
license = "BSD-2-Clause"
url = "https://github.com/maolan/edit"
assets = [
  { source = "target/release/maolan-editor", dest = "/usr/bin/maolan-editor", mode = "755" },
  { source = "assets/desktop/maolan-editor-linux.desktop", dest = "/usr/share/applications/maolan-editor.desktop", mode = "644" },
  { source = "assets/images/maolan-editor-icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/maolan-editor-icon.svg", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/maolan-editor/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/maolan-editor/LICENSE", mode = "644" },
]
