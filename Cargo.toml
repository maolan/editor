[package]
name = "maolan-editor"
version = "0.0.5"
edition = "2024"
description = "Simple audio editor for Maolan audio files"
license = "BSD-2-Clause"
readme = "README.md"
publish = true
repository = "https://github.com/maolan/edit"
homepage = "https://maolan.rs"
keywords = ["audio", "edit", "sound"]
categories = ["multimedia::audio"]

[profile.dev]
opt-level = 3
debug = true

[dependencies]
maolan-engine = "0.2.68"
maolan-widgets = "0.0.36"
rfd = "0.17.2"
rubato = "5.0.0"
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["sync", "time"] }
toml = "1.1.2"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12.1"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt", "macros"] }
