[package]
name = "maolan-editor"
version = "0.0.8"
edition = "2024"
description = "Simple audio editor for Maolan audio files"
license = "BSD-2-Clause"
readme = "README.md"
publish = true
repository = "https://github.com/maolan/edit"
homepage = "https://maolan.rs"
keywords = ["audio", "edit", "sound"]
categories = ["multimedia::audio"]

[profile.dev]
opt-level = 3
debug = true

[features]
default = ["standalone"]
standalone = [
    "dep:alsa",
    "dep:maolan-engine",
    "dep:oxideav-basic",
    "dep:oxideav-core",
    "dep:oxideav-flac",
    "dep:oxideav-mp3",
    "dep:oxideav-ogg",
    "dep:symphonia",
]

[dependencies]
maolan-engine = { version = "0.2.70", optional = true }
oxideav-core = { version = "0.1.35", optional = true }
oxideav-basic = { version = "0.0.10", optional = true }
oxideav-flac = { version = "0.0.11", optional = true }
oxideav-mp3 = { version = "0.1.3", optional = true }
oxideav-ogg = { version = "0.1.8", optional = true }
symphonia = { version = "0.6.1", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"], optional = true }
maolan-widgets = "0.0.37"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
rubato = "5.0.0"
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["sync", "time"] }
toml = "1.1.2"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.12.1", optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt", "macros"] }
